# The pipeline of the disk resource scheduler.
#
# The daemon runs on Linux in production, and the pipeline runs on Linux too:
# the free space and the rename between the volumes behave the same way
# there as they do on the media server.

image: golang:1.27

stages:
  - check
  - test

variables:
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"

cache:
  key: "$CI_PROJECT_ID"
  paths:
    - .cache/go-mod
    - .cache/go-build

gofmt:
  stage: check
  script:
    - |
      unformatted=$(gofmt -l ./cmd ./internal ./e2e)
      if [ -n "$unformatted" ]; then
        echo "the code is not formatted, run 'make fmt':"
        echo "$unformatted"
        exit 1
      fi

vet:
  stage: check
  script:
    - go vet ./...

build:
  stage: check
  script:
    - go build -o bin/diskd ./cmd/diskd

test:
  stage: test
  script:
    - go test ./... -count=1 -race -covermode=atomic -coverprofile=coverage.out
    - go tool cover -func=coverage.out
  coverage: '/^total:\s+\(statements\)\s+\d+\.\d+%/'
  artifacts:
    when: always
    paths:
      - coverage.out
    expire_in: 1 week
